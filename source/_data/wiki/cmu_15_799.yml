description: CMU 15-799 是卡内基梅隆大学 Andy Pavlo 教授推出的数据库优化器专题课程，主要介绍了将 SQL 转换为物理查询计划的经典方法及最新方法，同时也介绍了成本模型，自适应查询优化等内容，适合有一定数据库基础想要继续深入研究优化器的同学学习。

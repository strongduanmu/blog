name: CMU 11-768
title: 'CMU 11-768: AI Agents 学习笔记'
subtitle: 'LLM 智能体系统课程 | 从 Harness、评测到 RL 训练与研究'
tags: AI
description: CMU 11-768 是卡内基梅隆大学语言技术研究所面向研究生开设的 AI Agents 课程，由 Graham Neubig 与 Daniel Fried 联合授课。课程围绕 LLM 智能体的工具调用、上下文管理、技能与记忆、规划、评测、SFT/RL 训练、安全、交互和搜索展开，并通过三次个人作业与研究项目串联完整的智能体工程流程。

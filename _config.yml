## Themes: https://hexo.io/themes/
theme: stellar

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: git@github.com:strongduanmu/strongduanmu.github.io.git
  branch: master

# Google AdSense Plugin
hexo_google_adsense:
  enable: true
  log_msg: true
  tag_name: 'GoogleAdsense'
  file_path: 'layout/_partial/adsense-inline.html'
  auto_insert:
    enable: true
    after_paragraph: 2
